name: Release

# Push a version tag (e.g. `git tag v0.2.0 && git push origin v0.2.0`) to build installers for
# every platform. They are attached to a *draft* GitHub Release that you publish when ready.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust-targets: ""
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev build-essential file patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "Ditto-RS ${{ github.ref_name }}"
          releaseBody: |
            Download the installer for your system below.

            - **macOS** (Apple silicon & Intel): `.dmg`. The app is not notarized yet: after the first launch attempt, choose System Settings → Privacy & Security → Open Anyway, then allow Accessibility access when asked.
            - **Windows**: `-setup.exe` or `.msi`. SmartScreen may ask you to confirm: More info → Run anyway.
            - **Linux**: `.AppImage`, `.deb` or `.rpm`.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
