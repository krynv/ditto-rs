<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ditto-RS Options</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="layout">
    <nav id="nav" class="nav" aria-label="Option pages"></nav>
    <main class="page-wrap">
      <div id="page" class="page"></div>
      <footer class="savebar">
        <button id="defaults" class="btn">Reset to Defaults</button>
        <span id="save-status" class="save-status" role="status"></span>
        <button id="revert" class="btn" disabled>Revert</button>
        <button id="save" class="btn primary" disabled>Save</button>
      </footer>
    </main>
  </div>
  <script src="common.js"></script>
  <script src="settings.js"></script>
</body>
</html>
